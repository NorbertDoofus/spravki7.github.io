<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Маршрут машиніста</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans:wght@400;500;600&display=swap');

:root {
  --navy:    #0b2545;
  --accent:  #e8a020;
  --green:   #1a7a4a;
  --red:     #c0392b;
  --surface: #f0f4f8;
  --border:  #cfd8e3;
  --text:    #1a2332;
  --muted:   #6b7a8d;
  --mono:    'JetBrains Mono', monospace;
  --sans:    'Noto Sans', sans-serif;
  --card-bg: #0b2545;
  --card-text: #b8d4f0;
  --card-sub:  #7a9ec0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --navy: #0d1b2a; --accent: #f0b429;
    --green: #1e8a52; --red: #e74c3c;
    --surface: #111e2d; --border: #1e3048;
    --text: #d8e6f0; --muted: #7a95b0;
    --card-bg: #0d1b2a;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--sans);
  background: var(--surface);
  color: var(--text);
  padding: 12px;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100dvh;
}

/* ── Header ── */
h2 {
  font-size: 17px; font-weight: 600;
  color: var(--navy);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
@media (prefers-color-scheme: dark) { h2 { color: var(--card-text); } }

/* ── Toolbar ── */
.toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
.btn-add   { flex: 1; background: var(--green); color: #fff; font-family: var(--sans); font-size: 14px; font-weight: 600; border: none; padding: 11px 16px; border-radius: 8px; cursor: pointer; }
.btn-clear { background: transparent; color: var(--muted); font-family: var(--sans); font-size: 13px; border: 1px solid var(--border); padding: 11px 14px; border-radius: 8px; cursor: pointer; }

/* ── Row cards (mobile) ── */
.rows-list { display: flex; flex-direction: column; gap: 8px; }

.row-card {
  background: var(--card-bg);
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.06);
}

.row-card-header {
  display: flex;
  align-items: center;
  padding: 10px 12px;
  gap: 8px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.row-num {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--card-sub);
  min-width: 18px;
}
.row-st {
  flex: 1;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  background: transparent;
  border: none;
  color: var(--card-text);
  outline: none;
  min-width: 0;
}
.row-st::placeholder { color: rgba(184,212,240,.35); }
.row-actions { display: flex; gap: 4px; }
.btn-gear { background: transparent; border: none; color: var(--card-sub); font-size: 16px; padding: 4px 6px; cursor: pointer; border-radius: 6px; }
.btn-del  { background: transparent; border: none; color: var(--red); font-size: 14px; padding: 4px 8px; cursor: pointer; border-radius: 6px; }

.row-card-body {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0;
}
.row-field {
  display: flex;
  flex-direction: column;
  padding: 8px 10px;
  border-right: 1px solid rgba(255,255,255,.06);
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.row-field:nth-child(3n) { border-right: none; }
.row-field-label {
  font-size: 9px;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--card-sub);
  margin-bottom: 3px;
}
.row-field input {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
  background: transparent;
  border: none;
  color: var(--card-text);
  outline: none;
  width: 100%;
  padding: 0;
  -moz-appearance: textfield;
}
.row-field input::-webkit-outer-spin-button,
.row-field input::-webkit-inner-spin-button { -webkit-appearance: none; }
.row-field input::placeholder { color: rgba(184,212,240,.3); font-weight: 400; }
.row-field input[type=time] { color-scheme: dark; }

.maneuver-val {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
}
.maneuver-val.zero { color: rgba(184,212,240,.3); }

/* details panel */
.row-details {
  background: rgba(255,255,255,.04);
  border-top: 1px solid rgba(255,255,255,.08);
  padding: 10px 12px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
  font-size: 13px;
  color: var(--card-sub);
}
.row-details label { display: flex; align-items: center; gap: 6px; }
.row-details input[type=number] {
  font-family: var(--mono);
  font-size: 13px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 5px;
  padding: 3px 7px;
  color: var(--card-text);
  width: 65px;
  text-align: center;
  outline: none;
  -moz-appearance: textfield;
}
.row-details input[type=number]::-webkit-outer-spin-button,
.row-details input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
.row-details input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }

/* ── Cold block ── */
.cold-block {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
  padding: 12px 14px;
  background: var(--card-bg);
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.06);
  color: var(--card-text);
}
.cold-label { font-size: 10px; letter-spacing: .5px; text-transform: uppercase; color: var(--card-sub); white-space: nowrap; }
.cold-block input {
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 600;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 7px;
  padding: 6px 10px;
  color: var(--card-text);
  width: 90px;
  text-align: center;
  outline: none;
}
.cold-block input:focus { border-color: var(--accent); }
#cold-hint { font-size: 11px; color: var(--muted); }

/* ── Summary cards ── */
.summary-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin-top: 10px;
}
@media (min-width: 600px) {
  .summary-grid { grid-template-columns: repeat(3, 1fr); }
}

.summary-card {
  background: var(--card-bg);
  color: var(--card-text);
  border-radius: 10px;
  padding: 14px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.9;
  border: 1px solid rgba(255,255,255,.06);
}
.card-title {
  font-size: 9px;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: var(--card-sub);
  margin-bottom: 8px;
  font-weight: 500;
  font-family: var(--sans);
}
.highlight       { color: var(--accent); font-weight: 600; }
.highlight-green { color: #4ecf8a; font-weight: 600; }

/* ── Ітог + Списуємо ── */
.wide-card {
  background: var(--card-bg);
  border-radius: 10px;
  padding: 14px;
  border: 1px solid rgba(255,255,255,.06);
  margin-top: 8px;
}
.wide-card .card-title { font-size: 9px; letter-spacing: .7px; text-transform: uppercase; color: var(--card-sub); margin-bottom: 12px; font-family: var(--sans); }

.kv-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px 16px;
}
@media (min-width: 480px) {
  .kv-grid { grid-template-columns: repeat(4, 1fr); }
}

.kv-row { display: flex; flex-direction: column; gap: 4px; }
.kv-row.kv-divider { border-top: 1px solid rgba(255,255,255,.1); padding-top: 10px; }
.kv-label { font-size: 9px; letter-spacing: .5px; text-transform: uppercase; color: var(--card-sub); font-family: var(--sans); }
.kv-value { font-family: var(--mono); font-size: 20px; font-weight: 600; color: var(--accent); }
.kv-value.green { color: #4ecf8a; }

.kv-input {
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 600;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 7px;
  padding: 5px 8px;
  color: var(--card-text);
  width: 100%;
  outline: none;
  -moz-appearance: textfield;
}
.kv-input::-webkit-outer-spin-button,
.kv-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.kv-input::placeholder { color: rgba(184,212,240,.2); font-weight: 400; }
.kv-input:focus { border-color: var(--accent); }
.kv-input.mismatch { border-color: var(--red) !important; color: var(--red) !important; }
</style>
</head>
<body>

<h2>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
  Маршрут машиніста
</h2>

<div class="toolbar">
  <button class="btn-add" onclick="addRow()">+ Додати рядок</button>
  <button class="btn-clear" onclick="clearAll()">Очистити</button>
</div>

<div class="rows-list" id="rows-list"></div>

<div class="cold-block">
  <span class="cold-label">❄ Холодний стан</span>
  <input type="text" id="cold-input" placeholder="год:хв" maxlength="5" inputmode="numeric"
    oninput="onColdInput(this.value)">
  <span id="cold-hint"></span>
</div>

<div class="summary-grid">
  <div class="summary-card">
    <div class="card-title">⚙ Маневри</div>
    <div id="maneuver-content">—</div>
    <div id="maneuver-total" style="margin-top:6px;border-top:1px solid rgba(255,255,255,.1);padding-top:6px"></div>
  </div>
  <div class="summary-card">
    <div class="card-title">🚛 Резерв</div>
    <div id="reserve-content">—</div>
  </div>
  <div class="summary-card">
    <div class="card-title">📊 Коефіцієнти поїздів</div>
    <div id="coeff-content">—</div>
  </div>
</div>

<!-- Ітог -->
<div class="wide-card">
  <div class="card-title">🧾 Ітог</div>
  <div class="kv-grid">
    <div class="kv-row">
      <span class="kv-label">Було в кг</span>
      <input class="kv-input" type="number" id="itog-bulo" placeholder="0" step="0.01" inputmode="decimal" oninput="renderItog()">
    </div>
    <div class="kv-row">
      <span class="kv-label">Уд. вес</span>
      <input class="kv-input" type="number" id="itog-ud" placeholder="0.000" step="0.001" inputmode="decimal" oninput="renderItog()">
    </div>
    <div class="kv-row kv-divider">
      <span class="kv-label">Норма</span>
      <span class="kv-value" id="itog-norma">—</span>
    </div>
    <div class="kv-row kv-divider">
      <span class="kv-label">В баку</span>
      <span class="kv-value green" id="itog-bak">—</span>
    </div>
  </div>
</div>

<!-- Списуємо -->
<div class="wide-card">
  <div class="card-title">📋 Списуємо</div>
  <div class="kv-grid">
    <div class="kv-row">
      <span class="kv-label">Було в кг</span>
      <input class="kv-input" type="number" id="spys-bulo" placeholder="0" step="0.01" inputmode="decimal" oninput="renderSpys()">
    </div>
    <div class="kv-row">
      <span class="kv-label">Уд. вес</span>
      <input class="kv-input" type="number" id="spys-ud" placeholder="0.000" step="0.001" inputmode="decimal" oninput="renderSpys()">
    </div>
    <div class="kv-row">
      <span class="kv-label">Норма, кг</span>
      <input class="kv-input" type="number" id="spys-norma" placeholder="0" step="0.01" inputmode="decimal" oninput="renderSpys()">
    </div>
    <div class="kv-row kv-divider">
      <span class="kv-label">Бак, кг</span>
      <span class="kv-value" id="spys-bak-kg">—</span>
    </div>
    <div class="kv-row kv-divider">
      <span class="kv-label">Бак, л</span>
      <span class="kv-value green" id="spys-bak-l">—</span>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let rows = [];
let coldValue = '';
let lastManeuverKg = 0, lastReserveFuel = 0, lastTrainFuel = 0;

// ── Persist ────────────────────────────────────────────────────────────────
function save() {
  const state = {
    rows,
    coldValue,
    itogBulo: document.getElementById('itog-bulo').value,
    itogUd:   document.getElementById('itog-ud').value,
    spysBulo: document.getElementById('spys-bulo').value,
    spysUd:   document.getElementById('spys-ud').value,
    spysNorma:document.getElementById('spys-norma').value,
  };
  try { localStorage.setItem('marshrut_v2', JSON.stringify(state)); } catch(e) {}
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem('marshrut_v2') || 'null');
    if (!s) return;
    rows = s.rows || [];
    coldValue = s.coldValue || '';
    document.getElementById('cold-input').value = coldValue;
    document.getElementById('itog-bulo').value  = s.itogBulo || '';
    document.getElementById('itog-ud').value    = s.itogUd   || '';
    document.getElementById('spys-bulo').value  = s.spysBulo || '';
    document.getElementById('spys-ud').value    = s.spysUd   || '';
    document.getElementById('spys-norma').value = s.spysNorma|| '';
  } catch(e) {}
}

// ── Helpers ────────────────────────────────────────────────────────────────
const num   = v => { const n = Number(v); return isNaN(n) ? 0 : n; };
const esc   = s => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const toMin = t => {
  if (!t || !t.includes(':')) return 0;
  const [h,m] = t.split(':').map(Number);
  return h*60 + m;
};
const fmtTime = m => {
  if (!m) return '00:00';
  const h = Math.floor(m/60), mm = m%60;
  return `${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
};
const getNorm = c => {
  if (c<=2) return 12; if (c<=5) return 8; if (c<=10) return 6.5;
  if (c<=20) return 6; if (c<=30) return 5; if (c<=40) return 4;
  return 3.5;
};
const calcManeuver = r => {
  const a = toMin(r.arr), d = toMin(r.dep);
  if (!a && !d) return 0;
  const diff = d - a + (d < a && r.newDay ? 24*60 : 0);
  return Math.max(0, diff);
};
const parseCold = () => {
  const v = coldValue.trim();
  if (!v) return 0;
  if (v.includes(':')) { const [h,m]=v.split(':').map(Number); return (isNaN(h)?0:h)*60+(isNaN(m)?0:m); }
  const n = Number(v); return isNaN(n) ? 0 : n*60;
};

// ── CRUD ───────────────────────────────────────────────────────────────────
function addRow() {
  rows.push({st:'',arr:'',dep:'',train:'',locomotives:1,distance:'',weight:'',fuelNorm:12,newDay:false,open:false});
  render(); save();
}
function delRow(i)    { rows.splice(i,1); render(); save(); }
function toggleOpen(i){ rows[i].open=!rows[i].open; render(); save(); }
function clearAll()   { if(!rows.length) return; if(confirm('Очистити всі рядки?')){ rows=[]; render(); save(); } }

function setField(i, f, v) {
  rows[i][f] = v;
  // update maneuver cell without full re-render
  const cards = document.querySelectorAll('.row-card');
  if (cards[i]) {
    const mv = cards[i].querySelector('.maneuver-val');
    if (mv) {
      const man = calcManeuver(rows[i]);
      mv.textContent = man > 0 ? fmtTime(man) : '—';
      mv.className = 'maneuver-val' + (man > 0 ? '' : ' zero');
    }
  }
  renderSummary(); save();
}
function setCheck(i, f, v) { rows[i][f]=v; renderSummary(); save(); }

// ── Render rows ────────────────────────────────────────────────────────────
function render() {
  const list = document.getElementById('rows-list');
  list.innerHTML = '';
  rows.forEach((r, i) => {
    const man    = calcManeuver(r);
    const hasMan = man > 0;
    const div = document.createElement('div');
    div.className = 'row-card';
    div.innerHTML = `
      <div class="row-card-header">
        <span class="row-num">${i+1}</span>
        <input class="row-st" type="text" value="${esc(r.st)}" placeholder="Станція"
          oninput="setField(${i},'st',this.value)">
        <div class="row-actions">
          <button class="btn-gear" onclick="toggleOpen(${i})">⚙</button>
          <button class="btn-del"  onclick="delRow(${i})">✕</button>
        </div>
      </div>
      <div class="row-card-body">
        <div class="row-field">
          <span class="row-field-label">Прибуття</span>
          <input type="time" value="${r.arr}" oninput="setField(${i},'arr',this.value)">
        </div>
        <div class="row-field">
          <span class="row-field-label">Відправл.</span>
          <input type="time" value="${r.dep}" oninput="setField(${i},'dep',this.value)">
        </div>
        <div class="row-field">
          <span class="row-field-label">Маневри</span>
          <span class="maneuver-val${hasMan?'':' zero'}">${hasMan?fmtTime(man):'—'}</span>
        </div>
        <div class="row-field">
          <span class="row-field-label">Поїзд №</span>
          <input type="text" value="${esc(r.train)}" placeholder="№" inputmode="numeric"
            oninput="setField(${i},'train',this.value)">
        </div>
        <div class="row-field">
          <span class="row-field-label">Лок-ви</span>
          <input type="number" value="${r.locomotives}" min="1" max="10" inputmode="numeric"
            oninput="setField(${i},'locomotives',this.value)">
        </div>
        <div class="row-field">
          <span class="row-field-label">Відстань</span>
          <input type="number" value="${r.distance}" placeholder="0" inputmode="decimal"
            oninput="setField(${i},'distance',this.value)">
        </div>
        <div class="row-field">
          <span class="row-field-label">Вага, т</span>
          <input type="number" value="${r.weight}" placeholder="0" inputmode="decimal"
            oninput="setField(${i},'weight',this.value)">
        </div>
      </div>
      ${r.open ? `
      <div class="row-details">
        <label>⛽ Норма (кг/год):
          <input type="number" value="${r.fuelNorm}" step="0.1" min="0" inputmode="decimal"
            oninput="setField(${i},'fuelNorm',parseFloat(this.value)||12)">
        </label>
        <label>🌙 Нова доба:
          <input type="checkbox" ${r.newDay?'checked':''}
            onchange="setCheck(${i},'newDay',this.checked)">
        </label>
      </div>` : ''}
    `;
    list.appendChild(div);
  });
  renderSummary();
}

// ── Summary ────────────────────────────────────────────────────────────────
function renderSummary() {
  const manGroups = {};
  let reserveDist=0, reserveFuel=0;
  const coeffList=[];

  rows.forEach((r,i) => {
    const loc  = Math.max(1, num(r.locomotives));
    const w    = num(r.weight);
    const d    = num(r.distance);
    const norm = num(r.fuelNorm) || 12;
    const man  = calcManeuver(r);

    if (man > 0) {
      if (!manGroups[norm]) manGroups[norm] = {min:0, kg:0};
      manGroups[norm].min += man * loc;
      manGroups[norm].kg  += (man/60*norm) * loc;
    }
    if (w===0 && d>0) { reserveDist+=d; reserveFuel+=d*0.75*loc; }
    if (w>0  && d>0)  { coeffList.push({label: r.train||`Рядок ${i+1}`, c:(w*d)/1000/loc}); }
  });

  // Маневри з холодним станом
  const norms = Object.keys(manGroups);
  const totalManMin = Object.values(manGroups).reduce((s,g)=>s+g.min, 0);
  const coldMin = parseCold();
  let coldLeft = coldMin;
  const adjGroups = {};
  Object.keys(manGroups).sort((a,b)=>Number(a)-Number(b)).forEach(n => {
    const g = manGroups[n];
    const sub = Math.min(coldLeft, g.min);
    coldLeft -= sub;
    const adjMin = g.min - sub;
    adjGroups[n] = {min:adjMin, kg:adjMin/60*Number(n)};
  });

  document.getElementById('maneuver-content').innerHTML = norms.length===0
    ? '<span style="color:var(--muted)">Немає маневрів</span>'
    : Object.keys(adjGroups).map(n=>{
        const g=adjGroups[n];
        return `Норма <span class="highlight">${n} кг/год</span>: ${fmtTime(g.min)} → <span class="highlight">${g.kg.toFixed(2)} кг</span>`;
      }).join('<br>');

  const adjTotal = totalManMin - coldMin;
  const totalEl  = document.getElementById('maneuver-total');
  if (norms.length > 0) {
    const adjKg = Object.values(adjGroups).reduce((s,g)=>s+g.kg, 0);
    lastManeuverKg = adjKg;
    totalEl.innerHTML =
      `Загальний: <span class="highlight">${fmtTime(totalManMin)}</span>` +
      (coldMin>0 ? ` − ${fmtTime(coldMin)} = <span class="highlight">${fmtTime(Math.max(0,adjTotal))}</span>` : '') +
      `<br>Разом кг: <span class="highlight-green">${adjKg.toFixed(2)} кг</span>`;
  } else {
    totalEl.innerHTML='';
    lastManeuverKg=0;
  }

  // Резерв
  document.getElementById('reserve-content').innerHTML = reserveDist===0
    ? '<span style="color:var(--muted)">Немає резервних поїздок</span>'
    : `Відстань: <span class="highlight">${reserveDist.toFixed(1)} км</span><br>Витрати: <span class="highlight">${reserveFuel.toFixed(2)} кг</span>`;
  lastReserveFuel = reserveFuel;

  // Коефіцієнти
  if (coeffList.length===0) {
    document.getElementById('coeff-content').innerHTML='<span style="color:var(--muted)">Немає поїздок з вагою</span>';
    lastTrainFuel=0;
  } else {
    const total = coeffList.reduce((a,b)=>a+b.c, 0);
    const norm  = getNorm(total);
    const fuel  = total*norm;
    lastTrainFuel = fuel;
    document.getElementById('coeff-content').innerHTML =
      coeffList.map(item=>`${item.label}: <span style="color:#7db8e8">${item.c.toFixed(3)}</span>`).join('<br>') +
      `<br><br>Загальний: <span class="highlight">${total.toFixed(3)}</span> Норма: <span class="highlight">${norm}</span><br>` +
      `Фінальні витрати: <span class="highlight-green">${fuel.toFixed(2)} кг</span>`;
  }

  renderItog();
}

function renderItog() {
  const bulo  = parseFloat(document.getElementById('itog-bulo').value)||0;
  const ud    = parseFloat(document.getElementById('itog-ud').value)||0;
  const norma = lastManeuverKg + lastReserveFuel + lastTrainFuel;

  document.getElementById('itog-norma').textContent = norma>0 ? norma.toFixed(2)+' кг' : '—';
  if (bulo>0 && ud>0 && norma>0) {
    document.getElementById('itog-bak').textContent = ((bulo-norma)/ud).toFixed(2)+' л';
  } else {
    document.getElementById('itog-bak').textContent = '—';
  }
  renderSpys();
  save();
}

function renderSpys() {
  const sBulo  = document.getElementById('spys-bulo');
  const sUd    = document.getElementById('spys-ud');
  const sNorma = document.getElementById('spys-norma');
  const iBulo  = parseFloat(document.getElementById('itog-bulo').value)||0;
  const iUd    = parseFloat(document.getElementById('itog-ud').value)||0;

  const bv = parseFloat(sBulo.value)||0;
  const uv = parseFloat(sUd.value)||0;
  const nv = parseFloat(sNorma.value)||0;

  const buloOk = bv===0 || Math.abs(bv-iBulo)<0.001;
  const udOk   = uv===0 || Math.abs(uv-iUd)<0.0001;

  sBulo.classList.toggle('mismatch', bv>0 && !buloOk);
  sUd.classList.toggle('mismatch',   uv>0 && !udOk);

  const bakKgEl = document.getElementById('spys-bak-kg');
  const bakLEl  = document.getElementById('spys-bak-l');

  if (bv>0 && nv>0) {
    const bakKg = bv-nv;
    bakKgEl.textContent = Math.round(bakKg)+' кг';
    bakKgEl.style.color = bakKg<0 ? 'var(--red)' : '';
    if (uv>0) {
      const bakL = bakKg/uv;
      bakLEl.textContent = Math.round(bakL)+' л';
      bakLEl.style.color = bakL<0 ? 'var(--red)' : '';
    } else { bakLEl.textContent='—'; bakLEl.style.color=''; }
  } else {
    bakKgEl.textContent='—'; bakKgEl.style.color='';
    bakLEl.textContent='—';  bakLEl.style.color='';
  }
  save();
}

function onColdInput(v) {
  coldValue = v;
  const m = parseCold();
  document.getElementById('cold-hint').textContent = m>0 ? `= ${m} хв` : '';
  renderSummary(); save();
}

// ── Init ───────────────────────────────────────────────────────────────────
load();
render();

// Update cold hint if loaded
const cm = parseCold();
if (cm>0) document.getElementById('cold-hint').textContent = `= ${cm} хв`;
</script>
</body>
</html>
